[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renomeador-pdfs"
version = "6.5.0"
description = "Renomeador Semiautomático de PDFs com Web GUI Local, PyMuPDF e IA/OCR"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
]

[project.scripts]
renomeador = "renomeador.gui:main"
renomeador-cli = "renomeador.core:main"
renomeador-undo = "renomeador.desfazer:main"

[tool.setuptools.packages.find]
where = ["src"]
